<template>
  <section
    role="dialog"
    tabindex="-1"
    aria-modal="true"
    aria-label={title}
    class="slds-modal slds-fade-in-open"
  >
    <div class="slds-modal__container">
      <header class="slds-modal__header">
        <h2 class="slds-modal__title slds-hyphenate">{title}</h2>
      </header>
      <div class="slds-modal__content slds-var-p-around_medium">
        <template lwc:if={hasError}>
          <div
            class="slds-var-m-bottom_small slds-text-color_error"
            role="alert"
            data-id="error"
          >
            {errorMessage}
          </div>
        </template>
        <template lwc:if={isCreate}>
          <lightning-input
            data-id="subject"
            label="Subject"
            required
            value={subject}
            onchange={handleSubject}
          ></lightning-input>
          <lightning-combobox
            data-id="object"
            label="Object type"
            options={options}
            value={apiName}
            required
            onchange={handleObject}
          ></lightning-combobox>
          <template lwc:if={hasObject}>
            <lightning-record-picker
              data-id="record"
              label="Record"
              object-api-name={apiName}
              onchange={handleRecord}
            ></lightning-record-picker>
          </template>
        </template>
        <lightning-input
          data-id="start"
          type="datetime"
          label="Start"
          value={startValue}
          onchange={handleStart}
        ></lightning-input>
        <lightning-input
          data-id="end"
          type="datetime"
          label="End"
          value={endValue}
          onchange={handleEnd}
        ></lightning-input>
      </div>
      <footer class="slds-modal__footer">
        <lightning-button
          label="Cancel"
          onclick={handleCancel}
        ></lightning-button>
        <lightning-button
          class="slds-var-m-left_x-small"
          variant="brand"
          label="Save"
          onclick={handleSave}
        ></lightning-button>
      </footer>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
